<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Imóveis - Enviar Proposta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <a href="index.html" class="logo">
      Prime <span>Imóveis</span>
    </a>
    <nav class="menu-navegacao">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="imoveis.html">Imóveis</a></li>
        <li><a href="anunciar.html">Anunciar Imóvel</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- FORMULÁRIO DE PROPOSTA / PAGAMENTO -->
  <main class="destaques">
    <h2>Proposta de Negociação</h2>
    
    <form class="formulario-completo">
      <fieldset>
        <legend>Dados do Comprador</legend>
        <label for="nome-comprador">Nome Completo:</label>
        <input type="text" id="nome-comprador" required>
        <br><br>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required>
      </fieldset>

      <br>

      <fieldset>
        <legend>Forma de Pagamento e Condições</legend>
        <label for="pagamento">Pretende pagar via:</label>
        <select id="pagamento" name="pagamento">
          <option value="financiamento">Financiamento Bancário</option>
          <option value="vista">À Vista (Pix / Transferência)</option>
          <option value="consorcio">Carta de Consórcio</option>
        </select>
        <br><br>
        <label for="entrada">Valor de Entrada Pretendido (R$):</label>
        <input type="number" id="entrada" placeholder="Ex: 200000">
      </fieldset>

      <br>
      <button type="submit" class="botao-principal">Enviar Proposta Oficial</button>
    </form>
  </main>
<footer class="rodape-site">
  <div class="rodape-conteudo">

    </div>
  </div>
</footer>
</body>
</html>
