<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Imóveis - Fale Conosco</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <a href="index.html" class="logo">
      Prime <span>Imóveis</span>
    </a>
    <nav class="menu-navegacao">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="imoveis.html">Imóveis</a></li>
        <li><a href="anunciar.html">Anunciar Imóvel</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- BANNER SIMPLES DE TÍTULO -->
  <section class="banner" style="padding: 40px 20px;">
    <h1>Fale <span>Conosco</span></h1>
    <p>Estamos prontos para ajudar você a encontrar o imóvel ideal.</p>
  </section>

  <!-- CONTEÚDO PRINCIPAL: FORMULÁRIO -->
  <main class="destaques">
    <form class="formulario-completo">
      
      <!-- Bloco 1: Dados Pessoais -->
      <fieldset>
        <legend>Seus Dados</legend>
        
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="text" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        <br><br>

        <label for="telefone">Telefone / WhatsApp:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 90000-0000" required>
      </fieldset>

      <br>

      <!-- Bloco 2: Motivo e Mensagem -->
      <fieldset>
        <legend>Sua Mensagem</legend>
        
        <label for="assunto">Assunto:</label>
        <select id="assunto" name="assunto">
          <option value="duvida">Dúvida sobre um imóvel</option>
          <option value="visita">Agendar visita</option>
          <option value="vender">Quero vender meu imóvel</option>
          <option value="outro">Outro assunto</option>
        </select>
        <br><br>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui os detalhes do que você precisa..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;" required></textarea>
      </fieldset>

      <br>
      
      <!-- Botão Enviar -->
      <div style="text-align: center;">
        <button type="submit" class="botao-principal" style="border: none; cursor: pointer; font-size: 16px;">
          Enviar Mensagem
        </button>
      </div>

    </form>
  </main>

  <!-- RODAPÉ DO SITE -->
  <footer class="rodape-site">
    <div class="rodape-conteudo">
      <div class="rodape-logo">
        Prime <span>Imóveis</span>
      </div>
      <p>&copy; 2026 Prime Imóveis. Todos os direitos reservados.</p>
      <div class="rodape-links">
        <a href="index.html">Início</a> | 
        <a href="imoveis.html">Imóveis</a> | 
        <a href="contato.html">Contato</a>
      </div>
    </div>
  </footer>

<script src="script.js"></script>
</body>
</html>
